<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" href="images/HN_logo.png" type="image/png">
    <title>Nemeth Art Gallery</title>
</head>
<body>
    <header>
        <a href="../index.html"><img src="../images/HN_logo.png" class="logo" alt="Nemeth Art Logo"></a>
        <h1>Németh Art</h1>
        <div class="nav">
            <ul>
                <li><a href="../index.html"><i class="fa-solid fa-house"></i>Home</a></li>
                <li><a href="store.html"><i class="fa-solid fa-store"></i>Store</a></li>
                <li><a href="gallery.html" class="active"><i class="fa-solid fa-images"></i>Gallery</a></li>
                <li><a href="contact.html"><i class="fa-solid fa-envelope"></i>Contact</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-shopping-cart"></i>Cart</a></li>
            </ul>
        </div>
    </header>
    <main>
        <h2>Gallery</h2>
        <section class="gallery">
            <div class="art-item">
                <div class="gall">
                    <div class="media-container" data-hover-video="https://res.cloudinary.com/demo/video/upload/v1691234567/sample.mp4">
                        <img src="../images/xxx.jpg" alt="artwork image">
                    </div>
                </div>
                <p>XXX stippling</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <img src="../images/sza.jpg" alt="sza image">
                </div>
                <p>SZA</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <img src="../images/rose.jpg" alt="rose image">
                </div>
                <p>Rose</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <img src="../images/stipple.jpg" alt="stipple image">
                </div>
                <p>Stipple</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <img src="../images/guashe.jpg" alt="guashe image">
                </div>
                <p>Guashe</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <img src="../images/kai.jpg" alt="kai image">
                </div>
                <p>Sensei Kreese</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <img src="../images/olivia.jpg" alt="olivia image">
                </div>
                <p>Olivia Rodrigo</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <div class="media-container" data-hover-video="https://res.cloudinary.com/dccdghj1b/video/upload/v1780492365/lv_0_20260527163346_dp0ulr.mp4">
                        <img src="../images/ikigai.jpg" alt="ikigai image">
                    </div>
                </div>
                <p>Ikigai Japan</p>
            </div>
        </section>
    </main>
    <footer>
        <p><i class="fa-solid fa-palette"></i> &copy; 2026 Nemeth Art</p>
    </footer>
    <script src="../js/main.js"></script>
</body>
</html>
