<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Nemeth Art Gallery</title>
</head>
<body>
    <header>
        <a href="../index.html"><img src="../images/logo_temp.jpg" class="logo" alt="Nemeth Art Logo"></a>
        <h1>Németh Art</h1>
        <div class="nav">
            <ul>
                <li><a href="../index.html"><i class="fa-solid fa-house"></i>Home</a></li>
                <li><a href="store.html"><i class="fa-solid fa-store"></i>Store</a></li>
                <li><a href="gallery.html" class="active"><i class="fa-solid fa-images"></i>Gallery</a></li>
                <li><a href="contact.html"><i class="fa-solid fa-envelope"></i>Contact</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-shopping-cart"></i>Cart</a></li>
            </ul>
        </div>
    </header>
    <main>
        <h2>Gallery</h2>
        <section class="gallery">
            <div class="art-item">
                <img src="../images/xxx.jpg" class="gall" alt="artwork image">
                <p>XXX stippling</p>
            </div>
            <div class="art-item">
                <img src="../images/sza.jpg" class="gall" alt="sza image">
                <p>SZA painting</p>
            </div>
            <div class="art-item">
                <img src="../images/rose.jpg" class="gall" alt="rose image">
                <p>Rose painting</p>
            </div>
            <div class="art-item">
                <img src="../images/stipple.jpg" class="gall" alt="stipple image">
                <p>Stipple painting</p>
            </div>
            <div class="art-item">
                <img src="../images/guashe.jpg" class="gall" alt="guashe image">
                <p>Guashe painting</p>
            </div>
            <div class="art-item">
                <img src="../images/kai.jpg" class="gall" alt="kai image">
                <p>Sensei Kreese painting</p>
            </div>
            <div class="art-item">
                <img src="../images/olivia.jpg" class="gall" alt="olivia image">
                <p>Olivia Rodrigo painting</p>
            </div>
            <div class="art-item">
                <img src="../images/ikigai.jpg" class="gall" alt="ikigai image">
                <p>Ikigai Japan painting</p>
            </div>
        </section>
    </main>
    <footer>
        <p><i class="fa-solid fa-palette"></i> &copy; 2026 Nemeth Art</p>
    </footer>
    <script src="../js/main.js"></script>
</body>
</html>
