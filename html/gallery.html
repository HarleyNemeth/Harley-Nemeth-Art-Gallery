<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" href="../images/HN_logo.png" type="image/png">
    <title>Nemeth Art Gallery</title> 
</head>
<body>
    <header id="site-header"></header>
    <main>
        <h2>Gallery</h2>
        <section class="gallery">
            <div class="art-item">
                <div class="gall">
                    <div class="media-container" data-hover-video="https://res.cloudinary.com/dccdghj1b/video/upload/v1780492370/finsihes_bcgzzk.mp4">
                        <img src="../images/xxx.jpg" alt="artwork image">
                    </div>
                </div>
                <p>XXX stippling</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <div class="media-container" data-hover-video="https://res.cloudinary.com/dccdghj1b/video/upload/v1780493875/2025-03-05-175844531_rbqpdr.mp4">
                        <img src="../images/sza.jpg" alt="sza image">
                    </div>
                </div>
                <p>SZA</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <div class="media-container" data-hover-video="https://res.cloudinary.com/dccdghj1b/video/upload/v1780492365/2025-04-15-142516458_gzyeqq.mp4">
                        <img src="../images/olivia.jpg" alt="olivia image">
                    </div>
                </div>
                <p>Olivia Rodrigo</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <div class="media-container" data-hover-video="https://res.cloudinary.com/dccdghj1b/video/upload/v1780492365/lv_0_20260527163346_dp0ulr.mp4">
                        <img src="../images/ikigai232.jpg" alt="ikigai image">
                    </div>
                </div>
                <p>Ikigai Japan</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <img src="../images/rose.jpg" alt="rose image">
                </div>
                <p>Rose</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <img src="../images/guashe.jpg" alt="guashe image">
                </div>
                <p>Guashe</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <img src="../images/kai.jpg" alt="kai image">
                </div>
                <p>Sensei Kreese</p>
            </div>
            <div class="art-item">
                <div class="gall">
                    <img src="../images/stipple.jpg" alt="stipple image">
                </div>
                <p>Stipple</p>
            </div>
        </section>
    </main>
    <footer>
        <p><i class="fa-solid fa-palette"></i> &copy; 2026 Nemeth Art</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-ltrjvnR4/J6G3CeRa6oWj8b6ZbKfvl6t0l5LWg4ifGTX0V5jsZ1hpCqhi7O7anWa" crossorigin="anonymous"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
